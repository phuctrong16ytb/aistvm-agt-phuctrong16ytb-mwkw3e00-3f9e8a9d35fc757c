
# AISTVM: bounded AI agent machine, not persistent hosting.
# GitHub-hosted jobs have a maximum lifetime of 360 minutes. No renew loop.
name: AISTVM AI agent session
run-name: "AISTVM AI | aistagent"
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: aistvm-agent-session
  cancel-in-progress: false
jobs:
  agent-session:
    name: AI agent machine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AISTVM_USERNAME: "aistagent"
      AISTVM_DURATION_MINUTES: "20"
      AISTVM_WORKSPACE: "/home/runner/aistvm-agent"
      AISTVM_AGENT_MODEL: "opencode/deepseek-v4.1-flash-free"
    steps:
      - name: Establish hard job deadline
        run: |
          set -euo pipefail
          deadline=$(date -u -d "+$((30 - 1)) minutes" +%Y-%m-%dT%H:%M:%SZ)
          echo "AISTVM_JOB_DEADLINE=$deadline" >> "$GITHUB_ENV"
          session_deadline=$(date -u -d "+20 minutes" +%Y-%m-%dT%H:%M:%SZ)
          echo "AISTVM_SESSION_DEADLINE=$session_deadline" >> "$GITHUB_ENV"

      - name: Check out agent server
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AI machine, install agent runtime and Tailscale
        id: prepare
        timeout-minutes: 15
        env:
          AISTVM_RDP_PASSWORD: ${{ secrets.AISTVM_RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.AISTVM_TAILSCALE_AUTH_KEY }}
          AISTVM_AGENT_TOKEN: ${{ secrets.AISTVM_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          stage='starting'
          report_failure() {
            echo "AI machine setup failed at '$stage': $1"
            echo 'Check the Tailscale auth key/device approval, the selected runner image and network access to the agent runtime installer.'
          }
          trap 'report_failure "unexpected error"' ERR
          username="$AISTVM_USERNAME"
          if [[ ! "$username" =~ ^[a-z_][a-z0-9_-]{2,31}$ ]]; then
            report_failure 'Invalid AI username.'
            exit 1
          fi
          password="$AISTVM_RDP_PASSWORD"
          if [[ ${#password} -lt 12 || ${#password} -gt 127 ]]; then
            report_failure 'Password length is out of range.'
            exit 1
          fi
          if [[ ! "$password" =~ [A-Z] || ! "$password" =~ [a-z] || ! "$password" =~ [0-9] || ! "$password" =~ [^A-Za-z0-9] ]]; then
            report_failure 'Password does not meet the security policy.'
            exit 1
          fi
          if [[ "$password" == *"$username"* ]]; then
            report_failure 'Password must not contain the username.'
            exit 1
          fi
          if [[ ! "$AISTVM_AGENT_TOKEN" =~ ^[A-Za-z0-9_-]{20,}$ ]]; then
            report_failure 'The agent token is missing or malformed.'
            exit 1
          fi
          if id "$username" >/dev/null 2>&1; then
            report_failure 'Refusing to modify an existing user.'
            exit 1
          fi

          stage='starting firewall'
          sudo ufw --force reset >/dev/null 2>&1 || true
          sudo ufw default deny incoming >/dev/null 2>&1 || true
          sudo ufw default allow outgoing >/dev/null 2>&1 || true

          stage='creating AI user'
          sudo useradd --create-home --shell /bin/bash "$username"
          echo "$username:$password" | sudo chpasswd
          echo "AISTVM_CREATED_USER=$username" >> "$GITHUB_ENV"
          sudo mkdir -p "$AISTVM_WORKSPACE"
          sudo chown "$username:$username" "$AISTVM_WORKSPACE"

          stage='granting full sudo'
          echo "$username ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/aistvm-session >/dev/null
          sudo chmod 0440 /etc/sudoers.d/aistvm-session
          sudo visudo -cf /etc/sudoers.d/aistvm-session >/dev/null

          stage='installing agent runtime'
          # The runtime ships a native binary selected by its installer. Prefer
          # the package manager path; fall back to the vendor installer.
          export NPM_CONFIG_FUND=false NPM_CONFIG_AUDIT=false
          if command -v node >/dev/null 2>&1; then
            sudo -E npm install -g @opencode/cli >/dev/null 2>&1 || true
          fi
          if ! command -v opencode >/dev/null 2>&1; then
            curl -fsSL https://opencode.ai/install | bash
            if [[ -x "$HOME/.opencode/bin/opencode" ]]; then
              sudo ln -sf "$HOME/.opencode/bin/opencode" /usr/local/bin/opencode
            fi
          fi
          if ! command -v opencode >/dev/null 2>&1; then
            report_failure 'The agent runtime was not installed.'
            exit 1
          fi
          opencode --version >/dev/null 2>&1 || true

          stage='writing agent prompt'
          prompt="$GITHUB_WORKSPACE/aistvm-agent-prompt.md"
          if [[ ! -f "$prompt" ]]; then
            report_failure 'The agent prompt source is missing.'
            exit 1
          fi
          sudo cp "$prompt" "$AISTVM_WORKSPACE/aistvm-agent-prompt.md"
          sudo chown "$username:$username" "$AISTVM_WORKSPACE/aistvm-agent-prompt.md"

          stage='installing Tailscale'
          curl -fsSL https://tailscale.com/install.sh | sh
          if ! command -v tailscale >/dev/null 2>&1; then
            report_failure 'The Tailscale CLI was not installed.'
            exit 1
          fi

          stage='starting Tailscale daemon'
          if ! sudo tailscale status --json >/dev/null 2>&1; then
            sudo systemctl enable --now tailscaled >/dev/null 2>&1 || true
            for attempt in $(seq 1 30); do
              if sudo tailscale status --json >/dev/null 2>&1; then break; fi
              if [[ $attempt -eq 30 ]]; then
                report_failure 'The Tailscale daemon did not become ready.'
                exit 1
              fi
              sleep 1
            done
          fi

          stage='connecting Tailscale'
          auth_output=$(sudo tailscale up --auth-key="$TAILSCALE_AUTH_KEY" --accept-risk=lose-ssh --accept-dns=false --accept-routes=false --hostname="aistvm-agent-$GITHUB_RUN_ID" --timeout=90s 2>&1) || {
            auth_detail="${auth_output//$TAILSCALE_AUTH_KEY/[redacted]}"
            report_failure "Tailscale authentication failed: ${auth_detail:0:500}"
            exit 1
          }
          auth_output=''
          status_output=$(sudo tailscale status --json)
          backend=$(echo "$status_output" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("BackendState",""))')
          if [[ "$backend" != 'Running' ]]; then
            report_failure 'Tailscale is not Running; device approval may be required.'
            exit 1
          fi
          ip=$(echo "$status_output" | python3 -c 'import json,sys
          data = json.load(sys.stdin)
          for address in data.get("TailscaleIPs", []):
              parts = address.split(".")
              if len(parts) == 4 and parts[0] == "100" and 64 <= int(parts[1]) <= 127:
                  print(address)
                  break')
          if [[ -z "$ip" ]]; then
            report_failure 'No valid Tailscale IPv4 address.'
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

          stage='allowing tailnet access'
          sudo ufw allow from 100.64.0.0/10 to any port 8791 proto tcp >/dev/null
          sudo ufw --force enable >/dev/null

          stage='starting agent server'
          server="$GITHUB_WORKSPACE/aistvm-agent-server.py"
          if [[ ! -f "$server" ]]; then
            report_failure 'The agent server source is missing.'
            exit 1
          fi
          sudo cp "$server" "/opt/aistvm-agent-server.py"
          sudo chmod 0755 "/opt/aistvm-agent-server.py"
          log_file="$RUNNER_TEMP/aistvm-agent.log"
          : > "$log_file"
          sudo -u "$username" env \
            AISTVM_AGENT_PORT="8791" \
            AISTVM_AGENT_TOKEN="$AISTVM_AGENT_TOKEN" \
            AISTVM_AGENT_USER="$username" \
            AISTVM_AGENT_WORKSPACE="$AISTVM_WORKSPACE" \
            AISTVM_AGENT_MODEL="$AISTVM_AGENT_MODEL" \
            AISTVM_AGENT_PROMPT="$AISTVM_WORKSPACE/aistvm-agent-prompt.md" \
            nohup python3 -u "/opt/aistvm-agent-server.py" >"$log_file" 2>&1 &
          agent_pid=$!
          echo "AISTVM_AGENT_PID=$agent_pid" >> "$GITHUB_ENV"
          echo "AISTVM_AGENT_SOURCE=/opt/aistvm-agent-server.py" >> "$GITHUB_ENV"

          stage='verifying agent server'
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 "http://127.0.0.1:8791/health" >/dev/null; then
              break
            fi
            if [[ $attempt -eq 30 ]]; then
              echo 'Agent server health check failed. Diagnostics follow:'
              if kill -0 "$agent_pid" 2>/dev/null; then
                echo "Agent server process $agent_pid is still running."
                ps -o pid,ppid,user,stat,etime,args -p "$agent_pid" || true
              else
                echo "Agent server process $agent_pid is not running."
              fi
              echo 'Listening sockets:'
              (ss -ltnp 2>/dev/null || true) | grep -E ":8791\b" || true
              echo 'Agent server log:'
              sed -n '1,240p' "$log_file" 2>/dev/null || true
              report_failure 'The agent server health check failed; see the diagnostics above.'
              exit 1
            fi
            sleep 1
          done
          ready_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "ready_at=$ready_at" >> "$GITHUB_OUTPUT"
          unset password AISTVM_RDP_PASSWORD TAILSCALE_AUTH_KEY AISTVM_AGENT_TOKEN auth_output status_output

      - name: "Agent ready | ${{ steps.prepare.outputs.ip }} | ${{ steps.prepare.outputs.ready_at }}"
        id: readiness
        env:
          AISTVM_READY_AT: ${{ steps.prepare.outputs.ready_at }}
          AISTVM_READY_IP: ${{ steps.prepare.outputs.ip }}
          AISTVM_AGENT_TOKEN: ${{ secrets.AISTVM_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          status_output=$(sudo tailscale status --json)
          backend=$(echo "$status_output" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("BackendState",""))')
          if [[ "$backend" != 'Running' ]]; then
            echo 'Tailscale is not Running.'
            exit 1
          fi
          if ! echo "$status_output" | grep -q "$AISTVM_READY_IP"; then
            echo 'The expected Tailscale address is missing.'
            exit 1
          fi
          health=$(curl -fsS "http://$AISTVM_READY_IP:8791/health" -H "Authorization: Bearer $AISTVM_AGENT_TOKEN" || true)
          if [[ "$health" != *'"ok": true'* && "$health" != *'"ok":true'* ]]; then
            echo 'The agent server is not healthy over Tailscale.'
            exit 1
          fi
          ready_at=$(date -u -d "$AISTVM_READY_AT" +%s)
          session_deadline=$(date -u -d "$AISTVM_SESSION_DEADLINE" +%s)
          job_deadline=$(date -u -d "$AISTVM_JOB_DEADLINE" +%s)
          if [[ $job_deadline -lt $session_deadline ]]; then
            deadline=$job_deadline
          else
            deadline=$session_deadline
          fi
          if [[ $deadline -le $(date -u +%s) ]]; then
            echo 'Job deadline reached during setup.'
            exit 1
          fi
          echo "AISTVM_SESSION_DEADLINE=$deadline" >> "$GITHUB_ENV"
          echo "AISTVM_READY_EPOCH=$ready_at" >> "$GITHUB_ENV"
          echo 'AI machine, agent runtime and Tailscale Running state verified.'

      - name: Remove all temporary workflow sources after startup
        if: ${{ success() }}
        env:
          AISTVM_GITHUB_TOKEN: ${{ secrets.AISTVM_WORKFLOW_CLEANUP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $AISTVM_GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          base="https://api.github.com/repos/$GITHUB_REPOSITORY/contents"
          ref=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["GITHUB_REF_NAME"]))')
          workflow_files=$(curl -fsS "${headers[@]}" "$base/.github/workflows?ref=$ref" || echo '[]')
          for entry in $(echo "$workflow_files" | python3 -c 'import json,sys
          try:
              items = json.load(sys.stdin)
          except Exception:
              items = []
          for item in items:
              if item.get("type") == "file" and item.get("sha"):
                  print(item["url"] + "|" + item["sha"])'); do
            file_url="${entry%%|*}"; sha="${entry##*|}"
            body=$(python3 -c 'import json,sys; print(json.dumps({"message":"Remove temporary AISTVM agent workflow source after startup","sha":sys.argv[1],"branch":sys.argv[2]}))' "$sha" "$GITHUB_REF_NAME")
            curl -fsS "${headers[@]}" -X DELETE -H 'Content-Type: application/json' -d "$body" "$file_url" >/dev/null || true
          done
          for name in "aistvm-agent-server.py" "aistvm-agent-prompt.md"; do
            source=$(curl -fsS "${headers[@]}" "$base/$name?ref=$ref" || true)
            if [[ -n "$source" ]]; then
              sha=$(echo "$source" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))')
              url=$(echo "$source" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("url",""))')
              if [[ -n "$sha" && -n "$url" ]]; then
                body=$(python3 -c 'import json,sys; print(json.dumps({"message":"Remove temporary AISTVM agent source after startup","sha":sys.argv[1],"branch":sys.argv[2]}))' "$sha" "$GITHUB_REF_NAME")
                curl -fsS "${headers[@]}" -X DELETE -H 'Content-Type: application/json' -d "$body" "$url" >/dev/null || true
              fi
            fi
          done
          echo 'Temporary setup files removed after startup.'

      - name: Bounded AI agent session
        run: |
          set -euo pipefail
          deadline=$AISTVM_SESSION_DEADLINE
          while [[ $(date -u +%s) -lt $deadline ]]; do
            remaining=$((deadline - $(date -u +%s)))
            echo "AI agent heartbeat; $remaining seconds remain. No automatic renewal."
            if [[ $remaining -lt 60 ]]; then sleep $((remaining > 0 ? remaining : 1)); else sleep 60; fi
            backend=$(sudo tailscale status --json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("BackendState",""))')
            if [[ "$backend" != 'Running' ]]; then
              echo 'Tailscale disconnected.'
              exit 1
            fi
            if [[ -n "${AISTVM_AGENT_SOURCE:-}" ]] && ! pgrep -f -- "$AISTVM_AGENT_SOURCE" >/dev/null; then
              echo 'The agent server stopped.'
              exit 1
            fi
          done

      - name: Cleanup AI agent session
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          set -uo pipefail
          if [[ -n "${AISTVM_AGENT_PID:-}" ]]; then
            sudo kill "$AISTVM_AGENT_PID" 2>/dev/null || true
          fi
          if [[ -n "${AISTVM_AGENT_SOURCE:-}" ]]; then
            sudo pkill -f -- "$AISTVM_AGENT_SOURCE" 2>/dev/null || true
          fi
          sudo tailscale logout 2>/dev/null || true
          sudo ufw --force disable 2>/dev/null || true
          if [[ -n "${AISTVM_CREATED_USER:-}" ]] && id "$AISTVM_CREATED_USER" >/dev/null 2>&1; then
            sudo userdel -r "$AISTVM_CREATED_USER" 2>/dev/null || true
          fi
          echo 'Tailscale logged out and the temporary AI account removed.'
